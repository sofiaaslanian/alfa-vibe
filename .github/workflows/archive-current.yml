name: archive-current

on:
  push:
    branches: [fix/quality-only-score-recovery]

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-current
          rsync -a             --exclude='.git'             --exclude='.github/workflows/archive-current.yml'             ./ /tmp/alfa-vibe-current/
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-current
          path: /tmp/alfa-vibe-current/
          include-hidden-files: true
          retention-days: 1
