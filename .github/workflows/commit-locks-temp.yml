name: commit-locks-temp

on:
  push:
    branches: [experiment/iac-ci-sonar-cleanup-v2]

jobs:
  commit-locks:
    if: "!contains(github.event.head_commit.message, 'chore: add hashed dependency locks')"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install "uv==0.8.22"
      - run: uv pip compile --generate-hashes --python-version 3.11 requirements.txt -o requirements.lock
      - run: uv pip compile --generate-hashes --python-version 3.11 requirements-ner.txt -o requirements-ner.lock
      - name: Commit locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-ner.lock
          git commit -m "chore: add hashed dependency locks"
          git push
