name: Diagnose address mask layer

on:
  push:
    branches: [fix/stage1-stage2-architecture]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      STORAGE_BACKEND: memory
      CONTEXT_ML_ENABLED: "0"
      NER_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Rules-only address diagnostic
        run: |
          python - <<'PY'
          from app.config import load_config, SystemConfig
          from app.process import ProcessService
          from app.state import MemoryStateStore

          texts = [
              "Я живу в Самаре на улице Ленина 5.",
              "Мой адрес: Москва, ул. Лесная, д. 10, кв. 5.",
          ]
          cfg=load_config("config.yaml")
          cfg.systems["diag"] = SystemConfig(
              name="diag", enabled=True, pd_types=["ADDRESS"],
              allow_demask=True, mask_style="dev_redact",
              use_context_ml=False, use_ner=False,
          )
          svc=ProcessService(cfg, MemoryStateStore())
          for i,t in enumerate(texts):
              fs=svc.detect(t,"diag")
              print("TEXT",t)
              for f in fs:
                  print("F",f.to_dict(),"VALUE=",repr(t[f.start:f.end]))
              print("MASK",svc.process(t,f"diag-{i}","diag"))
          PY
