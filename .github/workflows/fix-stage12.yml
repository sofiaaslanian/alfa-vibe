name: Stage 1-2 architectural fix verification

on:
  push:
    branches: [fix/stage12-architectural]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage12-architectural
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Address splitter diagnostic
        run: |
          python - <<'PY'
          from app.pii import rules
          from app.pii.structural import normalize_structures
          from app.pii.detect import detect_pii
          text = "Я живу в Самаре на улице Ленина 5."
          raw = rules._detect_address_candidate(text)
          norm = normalize_structures(text, raw)
          final = detect_pii(text, enable_ner=False)
          def dump(name, fs):
              print(name)
              for f in fs:
                  print(f.type, f.part, repr(text[f.start:f.end]), f.start, f.end, f.detector, f.decision)
          dump("RAW", raw)
          dump("NORM", norm)
          dump("FINAL", final)
          PY
      - run: pytest -q

  ml-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      STORAGE_BACKEND: memory
      CONTEXT_ML_ENABLED: "1"
      NER_ENABLED: "1"
      NER_LOCAL: "1"
      CONTEXT_ML_FAIL_CLOSED: "1"
      NER_FAIL_CLOSED: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      ALLOW_WEAK_STATE_KEYS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage12-architectural
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-ner.lock
      - run: python -m pip install --require-hashes -r requirements-ner.lock
      - name: Frozen stage 1
        run: python scripts/eval_stage1_identification.py
      - name: Frozen stage 2
        run: python scripts/eval_stage2_masking.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-fixed-results
          path: |
            stage1_identification_results.json
            stage2_mask_demask_results.json
