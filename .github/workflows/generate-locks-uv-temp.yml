name: generate-locks-uv-temp

on:
  push:
    branches: [experiment/iac-ci-sonar-cleanup-v2]

jobs:
  locks:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install "uv==0.8.22"
      - run: uv pip compile --generate-hashes --python-version 3.11 requirements.txt -o requirements.lock
      - run: uv pip compile --generate-hashes --python-version 3.11 requirements-ner.txt -o requirements-ner.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-locks-uv
          path: |
            requirements.lock
            requirements-ner.lock
          retention-days: 1
