name: package-arch-v2-ml-off-temp

on:
  push:
    branches: [experiment/arch-v2-ml-off]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-architecture-v2-ml-off
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-arch-v2-ml-off-temp.yml'             ./ /tmp/alfa-vibe-architecture-v2-ml-off/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-architecture-v2-ml-off
          path: /tmp/alfa-vibe-architecture-v2-ml-off/
          include-hidden-files: true
          retention-days: 1
