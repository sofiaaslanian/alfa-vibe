name: package-architecture-v2-temp

on:
  push:
    branches: [architecture/v2-three-flows]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-architecture-v2
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-architecture-v2-temp.yml'             ./ /tmp/alfa-vibe-architecture-v2/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-architecture-v2
          path: /tmp/alfa-vibe-architecture-v2/
          include-hidden-files: true
          retention-days: 1
