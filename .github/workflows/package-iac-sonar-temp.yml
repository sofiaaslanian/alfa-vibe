name: package-iac-sonar-temp

on:
  push:
    branches: [experiment/iac-ci-sonar-cleanup]

jobs:
  validate-package:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose
        run: |
          cp .env.example .env
          sed -i 's/^DOMAIN=.*/DOMAIN=example.com/' .env
          sed -i 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' .env
          docker compose config --quiet
      - name: Build proxy image
        run: docker build -t alfa-vibe-iac-sonar-test .
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-iac-ci-sonar-cleanup
          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows/package-iac-sonar-temp.yml' \
            ./ /tmp/alfa-vibe-iac-ci-sonar-cleanup/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-iac-ci-sonar-cleanup
          path: /tmp/alfa-vibe-iac-ci-sonar-cleanup/
          include-hidden-files: true
          retention-days: 1
