name: package-p1-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p1-address-rollback
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-p1-address-rollback
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-p1-temp.yml'             ./ /tmp/alfa-vibe-p1-address-rollback/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-p1-address-rollback
          path: /tmp/alfa-vibe-p1-address-rollback/
          include-hidden-files: true
          retention-days: 1
