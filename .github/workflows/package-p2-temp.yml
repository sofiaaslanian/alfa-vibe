name: package-p2-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-single-redis-get
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-p2-single-redis-get
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-p2-temp.yml'             ./ /tmp/alfa-vibe-p2-single-redis-get/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-p2-single-redis-get
          path: /tmp/alfa-vibe-p2-single-redis-get/
          include-hidden-files: true
          retention-days: 1
