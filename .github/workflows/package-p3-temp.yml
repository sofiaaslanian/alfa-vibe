name: package-p3-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p3-queue-timeout-25ms
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-p3-queue-timeout-25ms
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-p3-temp.yml'             ./ /tmp/alfa-vibe-p3-queue-timeout-25ms/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-p3-queue-timeout-25ms
          path: /tmp/alfa-vibe-p3-queue-timeout-25ms/
          include-hidden-files: true
          retention-days: 1
