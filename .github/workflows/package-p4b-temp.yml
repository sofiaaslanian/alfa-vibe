name: package-p4b-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p4b-document-full-span
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-p4b-document-full-span
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-p4b-temp.yml'             ./ /tmp/alfa-vibe-p4b-document-full-span/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-p4b-document-full-span
          path: /tmp/alfa-vibe-p4b-document-full-span/
          include-hidden-files: true
          retention-days: 1
