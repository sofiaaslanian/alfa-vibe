name: package-p5-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p5-issue-date-passport-context
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-p5-issue-date-context
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-p5-temp.yml'             ./ /tmp/alfa-vibe-p5-issue-date-context/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-p5-issue-date-context
          path: /tmp/alfa-vibe-p5-issue-date-context/
          include-hidden-files: true
          retention-days: 1
