name: package-rollback-temp

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/rollback-group1
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-rollback-group1
          rsync -a             --exclude='.git'             --exclude='.github/workflows/archive-experiment.yml'             --exclude='.github/workflows/package-rollback-temp.yml'             ./ /tmp/alfa-vibe-rollback-group1/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-rollback-group1
          path: /tmp/alfa-vibe-rollback-group1/
          include-hidden-files: true
          retention-days: 1
