name: package-sonar-cleanup-temp

on:
  push:
    branches: [experiment/arch-v2-sonar-cleanup]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare snapshot
        run: |
          mkdir -p /tmp/alfa-vibe-arch-v2-sonar-cleanup
          rsync -a             --exclude='.git'             --exclude='.github/workflows/package-sonar-cleanup-temp.yml'             ./ /tmp/alfa-vibe-arch-v2-sonar-cleanup/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-arch-v2-sonar-cleanup
          path: /tmp/alfa-vibe-arch-v2-sonar-cleanup/
          include-hidden-files: true
          retention-days: 1
