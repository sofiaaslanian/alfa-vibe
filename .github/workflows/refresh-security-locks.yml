name: Refresh security dependency locks

on:
  push:
    branches:
      - experiment/dependency-security-cleanup
    paths:
      - requirements.txt
      - requirements-ner.txt
      - .github/workflows/refresh-security-locks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STORAGE_BACKEND: memory
      NER_ENABLED: "0"
      ALLOW_WEAK_STATE_KEYS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: experiment/dependency-security-cleanup
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Regenerate hashed locks
        run: |
          python -m pip install "pip==25.2" "pip-tools==7.5.1"
          pip-compile --generate-hashes --resolver=backtracking --output-file=requirements.lock requirements.txt
          pip-compile --generate-hashes --resolver=backtracking --output-file=requirements-ner.lock requirements-ner.txt
      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- requirements.lock requirements-ner.lock; then
            echo "Lock files unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requirements.lock requirements-ner.lock
            git commit -m "chore: refresh security dependency locks"
            git push
          fi
      - name: Install core dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q
      - name: Package submission
        run: bash scripts/pack_submission.sh /tmp/alfa-vibe-security-deps.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-security-deps
          path: /tmp/alfa-vibe-security-deps.zip
          if-no-files-found: error
