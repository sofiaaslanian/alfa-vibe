name: Slide 5 fact check

on:
  push:
    branches:
      - experiment/slide5-factcheck
    paths:
      - .github/workflows/slide5-factcheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STORAGE_BACKEND: memory
      NER_ENABLED: "0"
      CONTEXT_ML_ENABLED: "0"
      ALLOW_WEAK_STATE_KEYS: "1"
      STATE_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STATE_ENC_KEY: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/slide5-factcheck
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Full regression
        run: pytest -q
      - name: Architecture and behavior fact check
        run: |
          python - <<'PY'
          import io
          import logging
          import time
          from fastapi.testclient import TestClient

          from app.api import app
          from app.config import load_config
          from app.process import ProcessError, ProcessService
          from app.state import MemoryStateStore

          cfg = load_config("config.yaml")
          assert len(cfg.default_pd_types) == 17
          assert cfg.systems["demo"].allow_demask is True
          assert cfg.systems["demo"].use_context_ml is True
          assert cfg.systems["format_only"].allow_demask is False
          assert set(cfg.systems["format_only"].pd_types) == {"EMAIL", "PHONE", "INN", "PAYMENT_CARD"}

          text = (
              "Клиент Иван Петров, email: ivan.petrov@example.ru, "
              "тел. +7 (999) 123-45-67, карта 4111111111111111."
          )

          store = MemoryStateStore()
          svc = ProcessService(cfg, store)
          masked, state = svc.proxy_protect(
              text,
              consumer_id="slide5",
              operation_id="op-1",
              system="demo",
          )
          assert text != masked
          assert "ivan.petrov@example.ru" not in masked
          assert "+7 (999) 123-45-67" not in masked
          assert "4111111111111111" not in masked
          assert "Иван Петров" not in masked
          assert "⟦PII_" in masked

          # Sensitive state is encrypted, not stored as plaintext.
          raw_state = state.to_json()
          for secret in ("ivan.petrov@example.ru", "+7 (999) 123-45-67", "4111111111111111", "Иван Петров"):
              assert secret not in raw_state

          restored = svc.proxy_restore(
              masked,
              consumer_id="slide5",
              operation_id="op-1",
              system="demo",
          )
          assert restored == text

          # Per-system policy: format_only keeps only four format types and forbids demask.
          masked_format, _ = svc.proxy_protect(
              text,
              consumer_id="slide5-format",
              operation_id="op-format",
              system="format_only",
          )
          assert "Иван Петров" in masked_format
          assert "ivan.petrov@example.ru" not in masked_format
          try:
              svc.proxy_restore(
                  masked_format,
                  consumer_id="slide5-format",
                  operation_id="op-format",
                  system="format_only",
              )
          except ProcessError as exc:
              assert exc.status == 403
          else:
              raise AssertionError("format_only demask must be forbidden")

          # /process state contract: deterministic retry, reverse on masked payload, conflict on foreign payload.
          pstore = MemoryStateStore()
          psvc = ProcessService(cfg, pstore)
          ptext = "Email клиента: ivan.petrov@example.ru"
          pmasked = psvc.process(ptext, "payload-1", "autotest")
          assert pmasked != ptext
          assert psvc.process(ptext, "payload-1", "autotest") == pmasked
          assert psvc.process(pmasked, "payload-1", "autotest") == ptext
          try:
              psvc.process("другой payload", "payload-1", "autotest")
          except ProcessError as exc:
              assert exc.status == 409
          else:
              raise AssertionError("foreign payload must return 409")

          # Expired known operation -> 410; unknown proxy operation -> 404.
          exp_store = MemoryStateStore(live_ttl=0, seen_ttl=60)
          exp_svc = ProcessService(cfg, exp_store)
          exp_svc.process(ptext, "expired-1", "autotest")
          try:
              exp_svc.process(ptext, "expired-1", "autotest")
          except ProcessError as exc:
              assert exc.status == 410
          else:
              raise AssertionError("expired operation must return 410")

          try:
              svc.proxy_restore(
                  "anything",
                  consumer_id="missing",
                  operation_id="missing",
                  system="demo",
              )
          except ProcessError as exc:
              assert exc.status == 404
          else:
              raise AssertionError("unknown proxy operation must return 404")

          # Own application log message does not contain payload/PII.
          stream = io.StringIO()
          handler = logging.StreamHandler(stream)
          logger = logging.getLogger("alfa.process")
          old_level = logger.level
          logger.setLevel(logging.DEBUG)
          logger.addHandler(handler)
          try:
              log_svc = ProcessService(cfg, MemoryStateStore())
              log_svc.process(ptext, "log-safe-id", "autotest")
          finally:
              logger.removeHandler(handler)
              logger.setLevel(old_level)
          logs = stream.getvalue()
          assert "log-safe-id" in logs
          assert "ivan.petrov@example.ru" not in logs
          assert ptext not in logs

          # API x-ray endpoint exercises DETECT -> MASK -> state -> DEMASK without external LLM.
          with TestClient(app) as client:
              response = client.post(
                  "/demo/run",
                  headers={"X-System": "demo"},
                  json={"text": text, "skip_llm": True, "operation_id": "slide5-demo"},
              )
              assert response.status_code == 200, response.text
              body = response.json()
              assert body["leak_free"] is True
              assert body["roundtrip_ok"] is True
              assert body["llm_status"] == "skipped_by_flag"
              assert body["mask_strategy"] == "scoped_tokens_v1"
              assert body["stages_ms"]["total"] >= 0

              ready = client.get("/ready")
              assert ready.status_code == 200
              systems = client.get("/systems")
              assert systems.status_code == 200
              metrics = client.get("/metrics")
              assert metrics.status_code == 200

              print("FACTCHECK_OK")
              print("systems_enabled=", sum(1 for s in cfg.systems.values() if s.enabled))
              print("canonical_pii_types=", len(cfg.default_pd_types))
              print("detected_findings=", len(body["findings"]))
              print("leak_free=", body["leak_free"])
              print("roundtrip_ok=", body["roundtrip_ok"])
              print("mask_strategy=", body["mask_strategy"])
              print("demo_total_ms=", body["stages_ms"]["total"])
              print("demo_detect_ms=", body["stages_ms"]["detect"])
              print("demo_mask_state_ms=", body["stages_ms"]["mask"])
              print("demo_demask_ms=", body["stages_ms"]["demask"])
          PY
