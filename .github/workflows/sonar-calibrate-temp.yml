name: sonar-calibrate-temp

on:
  push:
    branches: [cursor/alfagen-sonar-10000]
    paths: [.github/workflows/sonar-calibrate-temp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 25.8.0.112029-community, trees: "zero_minors branch" }
          - { version: 25.9.0.112764-community, trees: "zero_minors branch" }
          - { version: 25.11.0.114957-community, trees: "zero_minors branch" }
          - { version: 25.12.0.117093-community, trees: "zero_minors branch" }
          - { version: 10.7-community, trees: "branch" }
          - { version: 25.10.0.114319-community, trees: "branch" }
          - { version: 26.1.0.118079-community, trees: "branch" }
          - { version: 26.5.0.122743-community, trees: "branch" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot trees
        run: |
          mkdir -p /tmp/out
          for pair in "zero_minors:4f7ebc5" "branch:HEAD"; do
            name=${pair%%:*}; ref=${pair##*:}
            mkdir -p /tmp/src-$name
            git archive --format=tar "$ref" | tar -x -C /tmp/src-$name
            rm -f /tmp/src-$name/.github/workflows/sonar-scan-temp.yml /tmp/src-$name/.github/workflows/sonar-calibrate-temp.yml
          done
          chmod -R a+rwX /tmp/src-*

      - name: Start SonarQube ${{ matrix.version }}
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:${{ matrix.version }}
          for i in $(seq 1 120); do
            s=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || true)
            [ "$s" = "UP" ] && break
            sleep 5
          done
          echo "status=$s version=$(curl -s http://localhost:9000/api/server/version)"
          PASS='Sonar-Scan-Temp-2026!'
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=$PASS" || true
          curl -s -u "admin:$PASS" -X POST \
            "http://localhost:9000/api/settings/set?key=sonar.multi-quality-mode.enabled&value=false" || true
          TOKEN=$(curl -s -u "admin:$PASS" -X POST "http://localhost:9000/api/user_tokens/generate?name=ci" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Scan and summarize
        run: |
          A="admin:$SONAR_PASS"; B=http://localhost:9000
          for name in ${{ matrix.trees }}; do
            docker run --rm --network host -e SONAR_HOST_URL=$B -e SONAR_TOKEN \
              -v /tmp/src-$name:/usr/src sonarsource/sonar-scanner-cli \
              -Dsonar.projectKey=$name -Dsonar.projectName=$name \
              -Dsonar.sources=. -Dsonar.scm.disabled=true > /tmp/out/scan-$name.log 2>&1 \
              || { echo "scan $name failed"; tail -n 40 /tmp/out/scan-$name.log; }
            CE=$(grep ceTaskUrl /tmp/src-$name/.scannerwork/report-task.txt | cut -d= -f2-)
            for i in $(seq 1 120); do
              st=$(curl -s -u "$A" "$CE" | jq -r .task.status)
              case "$st" in SUCCESS|FAILED|CANCELED) break;; esac
              sleep 3
            done
            curl -s -u "$A" "$B/api/issues/search?components=$name&componentKeys=$name&resolved=false&ps=500" \
              | jq --arg p "$name:" '.issues |= map(select(.component | startswith($p)))' > /tmp/out/issues-$name.json
            curl -s -u "$A" "$B/api/measures/component?component=$name&metricKeys=violations,major_violations,minor_violations,critical_violations,blocker_violations,info_violations,sqale_index,reliability_remediation_effort,security_remediation_effort,security_hotspots,ncloc" > /tmp/out/measures-$name.json
            echo "================ ${{ matrix.version }} :: $name (ce=$st) ================"
            jq -r '.component.measures[] | "\(.metric)=\(.value)"' /tmp/out/measures-$name.json | sort | tr '\n' ' '; echo
            jq -r '.issues[] | [.severity, .type, .rule, ((.component | sub("^[^:]*:"; "")) + ":" + ((.line // 0) | tostring)), (.effort // .debt // ""), .message] | @tsv' /tmp/out/issues-$name.json | sort
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrate2-${{ matrix.version }}
          path: /tmp/out/
          retention-days: 3
