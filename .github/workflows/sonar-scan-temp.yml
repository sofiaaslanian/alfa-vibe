name: sonar-scan-temp

on:
  push:
    branches: [cursor/alfagen-sonar-10000]
    paths-ignore: [.github/workflows/sonar-calibrate-temp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Snapshot submission tree (same as zip)
        run: |
          mkdir -p /tmp/src /tmp/out
          git archive --format=tar HEAD | tar -x -C /tmp/src
          rm -f /tmp/src/.github/workflows/sonar-scan-temp.yml
          (cd /tmp/src && find . -type f | sort) > /tmp/out/files.txt
          chmod -R a+rwX /tmp/src
          wc -l /tmp/out/files.txt

      - name: Start SonarQube Community
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:community
          for i in $(seq 1 120); do
            s=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || true)
            echo "status=$s"
            [ "$s" = "UP" ] && break
            sleep 5
          done
          PASS='Sonar-Scan-Temp-2026!'
          curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=$PASS" || true
          curl -s -u "admin:$PASS" -X POST \
            "http://localhost:9000/api/settings/set?key=sonar.multi-quality-mode.enabled&value=false" || true
          TOKEN=$(curl -s -u "admin:$PASS" -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci&type=GLOBAL_ANALYSIS_TOKEN" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PASS=$PASS" >> "$GITHUB_ENV"
          echo "server version: $(curl -s http://localhost:9000/api/server/version)" | tee /tmp/out/version.txt

      - name: Scan
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN \
            -v /tmp/src:/usr/src sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=alfa -Dsonar.projectName=alfa \
            -Dsonar.sources=. -Dsonar.scm.disabled=true 2>&1 | tail -n 120

      - name: Wait for background task and export issues
        run: |
          CE=$(grep ceTaskUrl /tmp/src/.scannerwork/report-task.txt | cut -d= -f2-)
          for i in $(seq 1 120); do
            st=$(curl -s -u "admin:$SONAR_PASS" "$CE" | jq -r .task.status)
            echo "ce=$st"
            case "$st" in SUCCESS|FAILED|CANCELED) break;; esac
            sleep 3
          done
          A="admin:$SONAR_PASS"
          B=http://localhost:9000
          curl -s -u "$A" "$B/api/issues/search?components=alfa&resolved=false&ps=500&additionalFields=_all" > /tmp/out/issues.json
          curl -s -u "$A" "$B/api/hotspots/search?projectKey=alfa&ps=500" > /tmp/out/hotspots.json
          curl -s -u "$A" "$B/api/measures/component?component=alfa&metricKeys=ncloc,lines,files,bugs,vulnerabilities,code_smells,sqale_index,sqale_debt_ratio,sqale_rating,reliability_rating,security_rating,duplicated_lines_density,security_hotspots,violations,blocker_violations,critical_violations,major_violations,minor_violations,info_violations" > /tmp/out/measures.json
          curl -s -u "$A" "$B/api/languages/list" | jq -c '[.languages[].key]' > /tmp/out/languages.json
          curl -s -u "$A" "$B/api/measures/component_tree?component=alfa&metricKeys=ncloc,violations&qualifiers=FIL&ps=500" > /tmp/out/files_measures.json
          jq -r '.issues[] | [.severity, .type, .rule, ((.component | sub("^alfa:"; "")) + ":" + ((.line // 0) | tostring)), ((.impacts // []) | map(.softwareQuality + "/" + .severity) | join(",")), .message] | @tsv' /tmp/out/issues.json | sort > /tmp/out/issues.tsv
          echo "===== ISSUES ($(jq .total /tmp/out/issues.json)) ====="
          cat /tmp/out/issues.tsv
          echo "===== HOTSPOTS ====="
          jq -r '.hotspots[]? | [.vulnerabilityProbability, .ruleKey, ((.component | sub("^alfa:"; "")) + ":" + ((.line // 0) | tostring)), .message] | @tsv' /tmp/out/hotspots.json
          echo "===== MEASURES ====="
          jq -r '.component.measures[] | "\(.metric)=\(.value)"' /tmp/out/measures.json | sort
          echo "===== ANALYZED FILES ====="
          jq -r '.components[] | "\(.path)\t" + ([.measures[] | "\(.metric)=\(.value)"] | join(" "))' /tmp/out/files_measures.json | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-report
          path: /tmp/out/
          retention-days: 3

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STORAGE_BACKEND: memory
      NER_ENABLED: "0"
      ALLOW_WEAK_STATE_KEYS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall -q app tests
      - run: pytest -q

  docker-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build proxy image
        run: docker build -t alfa-proxy .
      - name: Smoke test as non-root with Redis and 4 workers
        run: |
          docker network create alfa
          docker run -d --name redis --network alfa redis:7.4.11-alpine
          docker run -d --name proxy --network alfa -p 8080:8080 \
            -e STORAGE_BACKEND=redis -e REDIS_URL=redis://redis:6379/0 \
            -e ALLOW_WEAK_STATE_KEYS=1 -e PROXY_API_KEYS=demo-key alfa-proxy
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ready && break
            sleep 2
          done
          echo "uid=$(docker exec proxy id -u)"
          test "$(docker exec proxy id -u)" = "10001"
          for n in $(seq 1 20); do
            P="Client ivanov${n}@example.test tel +7 999 123-45-67"
            M=$(curl -sf http://localhost:8080/process -H 'Content-Type: application/json' \
              -d "{\"payload\":\"$P\",\"payload_id\":\"smoke-$n\"}" | jq -r .result)
            R=$(curl -sf http://localhost:8080/process -H 'Content-Type: application/json' \
              -d "{\"payload\":\"$M\",\"payload_id\":\"smoke-$n\"}" | jq -r .result)
            [ "$M" != "$P" ] || { echo "not masked: $n"; exit 1; }
            [ "$R" = "$P" ] || { echo "roundtrip failed: $n"; exit 1; }
          done
          echo "roundtrip ok x20"
          curl -sf -o /dev/null -w "ui=%{http_code}\n" http://localhost:8080/
          curl -sf -o /dev/null -w "css=%{http_code}\n" http://localhost:8080/ui/styles.css
          curl -sf -o /dev/null -w "icon=%{http_code}\n" http://localhost:8080/ui/icons/sparkle-mask.png
          curl -s -o /dev/null -w "proxy_no_key=%{http_code}\n" http://localhost:8080/proxy/chat \
            -H 'Content-Type: application/json' -d '{"text":"hi"}'
      - name: Container logs
        if: always()
        run: docker logs proxy 2>&1 | tail -n 40

  docker-ner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space for torch image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build NER image
        run: docker build -f Dockerfile.ner -t alfa-ner .
      - name: Smoke test model load as non-root
        run: |
          docker run -d --name ner -p 8090:8090 alfa-ner
          for i in $(seq 1 90); do
            curl -sf http://localhost:8090/health && break
            sleep 4
          done
          echo
          echo "uid=$(docker exec ner id -u)"
          test "$(docker exec ner id -u)" = "10001"
          curl -sf http://localhost:8090/detect -H 'Content-Type: application/json' \
            -d '{"text":"Меня зовут Иван Петров, я живу в Москве."}' | tee /tmp/ner.json
          test "$(jq '.entities | length' /tmp/ner.json)" -gt 0
      - name: Container logs
        if: always()
        run: docker logs ner 2>&1 | tail -n 40
