name: Stage 1 identification evaluation

on:
  push:
    branches: [experiment/stage1-identification-eval-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STORAGE_BACKEND: memory
      CONTEXT_ML_ENABLED: "1"
      NER_ENABLED: "1"
      NER_LOCAL: "1"
      CONTEXT_ML_FAIL_CLOSED: "1"
      NER_FAIL_CLOSED: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/stage1-identification-eval-v2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-ner.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ner.lock
      - name: Run stage 1 evaluation
        run: python scripts/eval_stage1_identification.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stage1-identification-results
          path: stage1_identification_results.json
