name: Stage 2 mask demask evaluation

on:
  push:
    branches: [experiment/stage2-mask-demask-eval]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      STORAGE_BACKEND: memory
      CONTEXT_ML_ENABLED: "1"
      NER_ENABLED: "1"
      NER_LOCAL: "1"
      CONTEXT_ML_FAIL_CLOSED: "1"
      NER_FAIL_CLOSED: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/stage2-mask-demask-eval
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-ner.lock
      - run: python -m pip install --require-hashes -r requirements-ner.lock
      - name: Run stage 2 evaluation
        run: python scripts/eval_stage2_masking.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-mask-demask-results
          path: stage2_mask_demask_results.json
