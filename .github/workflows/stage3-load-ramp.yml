name: Stage 3 load ramp

on:
  push:
    branches: [experiment/stage3-load-eval]
    paths: [.github/workflows/stage3-load-ramp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ramp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/stage3-load-eval
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - run: python -m pip install httpx==0.28.1
      - name: Warmup
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode create --n 20 --concurrency 2
      - name: Create c20
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode create --n 500 --concurrency 20
      - name: Create c50
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode create --n 1000 --concurrency 50
      - name: Create c100
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode create --n 2000 --concurrency 100
      - name: Create c180
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode create --n 3000 --concurrency 180
      - name: Pair c50
        run: python scripts/load_smoke.py --url http://135.106.220.67 --mode pair --n 500 --concurrency 50
      - name: 100k create
        run: python scripts/load_smoke.py --url http://135.106.220.67 --profile 100k --mode create --n 10 --concurrency 2
