name: Stage 3 load ramp

on:
  push:
    branches: [experiment/stage3-load-eval]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ramp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/stage3-load-eval
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run controlled ramp
        run: python scripts/load_stage3_target.py --url http://135.106.220.67 --duration 8 --levels 250,500,750,1000 --max-inflight 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-load-ramp
          path: stage3_load_ramp.json
