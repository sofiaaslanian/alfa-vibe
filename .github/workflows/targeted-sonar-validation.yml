name: Targeted Sonar cleanup validation

on:
  push:
    branches:
      - experiment/sonar-targeted-cleanup
    paths:
      - app/**
      - .github/workflows/targeted-sonar-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STORAGE_BACKEND: memory
      NER_ENABLED: "0"
      ALLOW_WEAK_STATE_KEYS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: experiment/sonar-targeted-cleanup
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall -q app tests
      - run: pytest -q
      - run: bash scripts/pack_submission.sh /tmp/alfa-vibe-sonar-targeted.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alfa-vibe-sonar-targeted
          path: /tmp/alfa-vibe-sonar-targeted.zip
          if-no-files-found: error
