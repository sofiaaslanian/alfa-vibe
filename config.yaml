systems:
  # Автотест /process — rules-only (быстро под AlfaSonar RPS)
  autotest:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: dev_redact
    use_ner: false

  demo:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: scoped_token
    # RuBERT + discourse: ФИО в свободном тексте, Пушкин ≠ клиент
    use_ner: true
    # Bonus 3.7: PIN/CVV alone stay open; with card → mask.
    combo_require:
      PIN: [PAYMENT_CARD]
      CVV: [PAYMENT_CARD]

  # Пример: только format-типы, без demask ответа LLM, без NER
  format_only:
    enabled: true
    pd_types: [EMAIL, PHONE, INN, PAYMENT_CARD]
    allow_demask: false
    mask_style: scoped_token
    use_ner: false

  # Высокий RPS: без PERSON → NER не вызывается
  high_rps:
    enabled: true
    pd_types: [EMAIL, PHONE, INN, PAYMENT_CARD, ADDRESS, BIRTH_DATE, PASSPORT_ISSUE_DATE, PASSPORT, INTERNATIONAL_PASSPORT, DRIVER_LICENSE, SUBDIVISION_CODE, SNILS, OMS, CVV, PIN, PLACE_OF_BIRTH, CITIZENSHIP, PASSPORT_ISSUER, CARDHOLDER_NAME]
    allow_demask: true
    mask_style: dev_redact
    use_ner: false

  disabled_example:
    enabled: false
    pd_types: []
    allow_demask: false
    mask_style: scoped_token

default_pd_types:
  - EMAIL
  - PHONE
  - INN
  - PAYMENT_CARD
  - ADDRESS
  - BIRTH_DATE
  - PASSPORT_ISSUE_DATE
  - PASSPORT
  - INTERNATIONAL_PASSPORT
  - DRIVER_LICENSE
  - SUBDIVISION_CODE
  - SNILS
  - OMS
  - CVV
  - PIN
  - PERSON
  - PLACE_OF_BIRTH
  - CITIZENSHIP
  - PASSPORT_ISSUER
  - CARDHOLDER_NAME

# Global combo empty — autotest/acceptance mask PIN/CVV alone.
# Enable per-system (see demo.combo_require) for bonus 3.7.
combo_require: {}

