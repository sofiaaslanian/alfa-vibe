systems:
  # Evaluator /process profile follows the target architecture:
  # context-defined PII goes through the ML flow.
  autotest:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: dev_redact
    use_context_ml: true

  demo:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: scoped_token
    use_context_ml: true
    combo_require:
      PIN: [PAYMENT_CARD]
      CVV: [PAYMENT_CARD]

  # Only the four format-defined types.
  format_only:
    enabled: true
    pd_types: [EMAIL, PHONE, INN, PAYMENT_CARD]
    allow_demask: false
    mask_style: scoped_token
    use_context_ml: false

  # Compatibility/high-RPS profile: same canonical types, context ML disabled.
  high_rps:
    enabled: true
    pd_types:
      - EMAIL
      - PHONE
      - INN
      - PAYMENT_CARD
      - BIRTH_DATE
      - PASSPORT
      - SUBDIVISION_CODE
      - PASSPORT_ISSUE_DATE
      - DRIVER_LICENSE
      - CVV
      - PIN
      - PERSON
      - PLACE_OF_BIRTH
      - CITIZENSHIP
      - PASSPORT_ISSUER
      - ADDRESS
      - CARDHOLDER_NAME
    allow_demask: true
    mask_style: dev_redact
    use_context_ml: false

  disabled_example:
    enabled: false
    pd_types: []
    allow_demask: false
    mask_style: scoped_token
    use_context_ml: false

# Canonical 17 types from the product table. Bonus document types are no longer
# part of the evaluator core pipeline.
default_pd_types:
  - PERSON
  - PLACE_OF_BIRTH
  - CITIZENSHIP
  - PASSPORT_ISSUER
  - ADDRESS
  - CARDHOLDER_NAME
  - BIRTH_DATE
  - PASSPORT
  - SUBDIVISION_CODE
  - PASSPORT_ISSUE_DATE
  - DRIVER_LICENSE
  - CVV
  - PIN
  - EMAIL
  - PHONE
  - INN
  - PAYMENT_CARD

combo_require: {}

pd_rules:
  - id: PERSON
    name: ФИО
    patterns: []
    mask: "dev_redact"
  - id: PLACE_OF_BIRTH
    name: Место рождения
    patterns: []
    mask: "dev_redact"
  - id: CITIZENSHIP
    name: Гражданство
    patterns: []
    mask: "dev_redact"
  - id: PASSPORT_ISSUER
    name: Орган, выдавший паспорт
    patterns: []
    mask: "dev_redact"
  - id: ADDRESS
    name: Адрес
    patterns: []
    mask: "dev_redact"
  - id: CARDHOLDER_NAME
    name: Имя держателя карты
    patterns: []
    mask: "dev_redact"
  - id: BIRTH_DATE
    name: Дата рождения
    patterns: []
    mask: "dev_redact"
  - id: PASSPORT
    name: Серия и номер паспорта
    patterns: []
    mask: "dev_redact"
  - id: SUBDIVISION_CODE
    name: Код подразделения
    patterns: []
    mask: "dev_redact"
  - id: PASSPORT_ISSUE_DATE
    name: Дата выдачи паспорта
    patterns: []
    mask: "dev_redact"
  - id: DRIVER_LICENSE
    name: Серия и номер водительского удостоверения
    patterns: []
    mask: "dev_redact"
  - id: CVV
    name: CVV-код
    patterns: []
    mask: "dev_redact"
  - id: PIN
    name: PIN-код карты
    patterns: []
    mask: "dev_redact"
  - id: EMAIL
    name: Email
    patterns: []
    mask: "dev_redact"
  - id: PHONE
    name: Номер телефона
    patterns: []
    mask: "dev_redact"
  - id: INN
    name: ИНН
    patterns: []
    mask: "dev_redact"
  - id: PAYMENT_CARD
    name: Номер платёжной банковской карты
    patterns: []
    mask: "dev_redact"

storage_backend: memory
