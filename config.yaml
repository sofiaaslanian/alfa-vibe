systems:
  # Автотест /process — все типы, demask через state (не header)
  autotest:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: dev_redact

  demo:
    enabled: true
    pd_types: []
    allow_demask: true
    mask_style: scoped_token

  # Пример: только format-типы, без demask ответа LLM
  format_only:
    enabled: true
    pd_types: [EMAIL, PHONE, INN, PAYMENT_CARD]
    allow_demask: false
    mask_style: scoped_token

  disabled_example:
    enabled: false
    pd_types: []
    allow_demask: false
    mask_style: scoped_token

default_pd_types:
  - EMAIL
  - PHONE
  - INN
  - PAYMENT_CARD
  - ADDRESS
  - BIRTH_DATE
  - PASSPORT_ISSUE_DATE
  - PASSPORT
  - DRIVER_LICENSE
  - SUBDIVISION_CODE
  - CVV
  - PIN
  - PERSON

pd_rules:
  - id: EMAIL
    name: Email
    patterns: []
    mask: "dev_redact"
  - id: PHONE
    name: Номер телефона
    patterns: []
    mask: "dev_redact"
  - id: INN
    name: ИНН
    patterns: []
    mask: "dev_redact"
  - id: PAYMENT_CARD
    name: Номер карты
    patterns: []
    mask: "dev_redact"
  - id: ADDRESS
    name: Адрес
    patterns: []
    mask: "dev_redact"
  - id: BIRTH_DATE
    name: Дата рождения
    patterns: []
    mask: "dev_redact"
  - id: PASSPORT_ISSUE_DATE
    name: Дата выдачи паспорта
    patterns: []
    mask: "dev_redact"
  - id: PASSPORT
    name: Серия и номер паспорта
    patterns: []
    mask: "dev_redact"
  - id: DRIVER_LICENSE
    name: Водительское удостоверение
    patterns: []
    mask: "dev_redact"
  - id: SUBDIVISION_CODE
    name: Код подразделения
    patterns: []
    mask: "dev_redact"
  - id: CVV
    name: CVV
    patterns: []
    mask: "dev_redact"
  - id: PIN
    name: PIN
    patterns: []
    mask: "dev_redact"
  - id: PERSON
    name: ФИО
    patterns: []
    mask: "dev_redact"

storage_backend: memory
