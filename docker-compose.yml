version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: alfa-redis
    # Not published to host — backend reaches redis:6379 on the compose network.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build: .
    container_name: alfa-proxy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      # Autotest load: keep NER off. Demo quality: NER_ENABLED=1 + ner deps.
      NER_ENABLED: ${NER_ENABLED:-0}
      NER_LOCAL: "1"
      NER_FAIL_CLOSED: "0"
      # Auth only for /proxy and /demo — /process is open for AlfaSonar.
      PROXY_API_KEYS: ${PROXY_API_KEYS:-demo-key}
      PROCESS_CONCURRENCY: ${PROCESS_CONCURRENCY:-180}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # CMD from Dockerfile: uvicorn --workers 4 (needs Redis)

volumes:
  redis_data:
