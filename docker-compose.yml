services:
  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-1gb}"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ner:
    build:
      context: .
      dockerfile: Dockerfile.ner
    environment:
      NER_ENABLED: "1"
      NER_LOCAL: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "8090"
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    build: .
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      # Context ML runs in the dedicated NER service; proxy stays slim.
      CONTEXT_ML_ENABLED: "${CONTEXT_ML_ENABLED:-1}"
      NER_ENABLED: "${CONTEXT_ML_ENABLED:-1}"
      NER_URL: "http://ner:8090"
      NER_LOCAL: "0"
      CONTEXT_ML_FAIL_CLOSED: "${CONTEXT_ML_FAIL_CLOSED:-1}"
      NER_FAIL_CLOSED: "${CONTEXT_ML_FAIL_CLOSED:-1}"
      PROXY_API_KEYS: "${PROXY_API_KEYS:-demo-key}"
      PROCESS_CONCURRENCY: "${PROCESS_CONCURRENCY:-2}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      ner:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:

volumes:
  redis_data:
  caddy_data:
  caddy_config:
