version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: alfa-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build: .
    container_name: alfa-proxy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      NER_ENABLED: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # CMD from Dockerfile: uvicorn --workers 4 (needs Redis)

volumes:
  redis_data:
